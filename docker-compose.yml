version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - ./backend/data:/app/data:ro
      - ./backend/knowledge_vault:/app/knowledge_vault:ro
      - mneme-chroma:/app/chroma_db
      - mneme-audit:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_started

volumes:
  mneme-chroma:
  mneme-audit:
